<svg width="1600" height="680" viewBox="0 0 1600 680" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="680" gradientUnits="userSpaceOnUse">
    <stop stop-color="#05070C"/>
    <stop offset="0.48" stop-color="#0B1020"/>
    <stop offset="1" stop-color="#070914"/>
  </linearGradient>
  <linearGradient id="brand" x1="520" y1="135" x2="1040" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F3EEFF"/>
    <stop offset="0.38" stop-color="#B89BFF"/>
    <stop offset="0.7" stop-color="#8F6DFF"/>
    <stop offset="1" stop-color="#79EAD6"/>
  </linearGradient>
  <linearGradient id="line" x1="240" y1="0" x2="1360" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#79EAD6" stop-opacity="0.18"/>
    <stop offset="0.45" stop-color="#9B7CFF" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#B9A7FF" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#79EAD6" stop-opacity="0.18"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#9B7CFF" stop-opacity=".32"/>
    <stop offset="1" stop-color="#9B7CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
</defs>

<rect width="1600" height="680" rx="36" fill="url(#bg)"/>
<circle cx="805" cy="350" r="250" fill="url(#glow)" opacity=".85">
  <animate attributeName="r" values="235;270;235" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".55;.9;.55" dur="7s" repeatCount="indefinite"/>
</circle>

<text x="800" y="104" text-anchor="middle" fill="#A5A9B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="5">PRIVATE FITNESS SYSTEM · LIVE PORTFOLIO</text>
<text x="800" y="196" text-anchor="middle" fill="#F7F6FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">PRism</text>
<text x="800" y="255" text-anchor="middle" fill="url(#brand)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="650">Train with intent. See the pattern.</text>
<text x="800" y="302" text-anchor="middle" fill="#A6ACBB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Training · Nutrition · Recovery · Progress · Private Cloud</text>

