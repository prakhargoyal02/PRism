<svg width="1500" height="620" viewBox="0 0 1500 620" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="620"><stop stop-color="#070A12"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
  <linearGradient id="pub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79EAD6"/><stop offset="1" stop-color="#77A8FF"/></linearGradient>
  <linearGradient id="pri" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B9A7FF"/><stop offset="1" stop-color="#8F6DFF"/></linearGradient>
</defs>
<rect width="1500" height="620" rx="32" fill="url(#bg)" stroke="#CDBFFF" stroke-opacity=".12"/>
<text x="750" y="70" text-anchor="middle" fill="#F7F6FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">One live URL. Two completely different data worlds.</text>
<text x="750" y="108" text-anchor="middle" fill="#8F96A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The public portfolio can be explored freely without crossing the private-data boundary.</text>

