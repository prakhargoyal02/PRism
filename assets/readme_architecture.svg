<text x="750" y="582" text-anchor="middle" fill="#777F92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.5">PUBLIC DEMO NEVER READS THE OWNER'S PRIVATE CLOUD ROW</text>
